# ============================================================
# Secret — 敏感配置（API Keys、数据库密码等）
# 注意：以下值为占位符，部署前请替换为真实值！
#
# 生成 base64 编码的命令：
#   echo -n "your-value" | base64
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: intelligent-cs
  labels:
    app: intelligent-customer-service
type: Opaque
stringData:
  # ---------- API Keys ----------
  OPENAI_API_KEY: "sk-your-openai-api-key-here"
  OPENAI_BASE_URL: "https://api.deepseek.com"
  OPENAI_MODEL: "deepseek-v4-flash"

  DEEPSEEK_API_KEY: "sk-your-deepseek-api-key-here"
  DEEPSEEK_BASE_URL: "https://api.deepseek.com"
  DEEPSEEK_MODEL: "deepseek-v4-flash"

  TAVILY_API_KEY: "tvly-your-tavily-api-key-here"
  DASHSCOPE_API_KEY: "sk-your-dashscope-api-key-here"

  # ---------- LangSmith ----------
  LANGSMITH_TRACING: "true"
  LANGSMITH_ENDPOINT: "https://api.smith.langchain.com"
  LANGSMITH_API_KEY: "lsv2_your-langsmith-api-key-here"
  LANGSMITH_PROJECT: "intelligent_customer_service"

  # ---------- 邮箱授权码 ----------
  EMAIL_AUTH_CODE: "your-email-auth-code-here"

  # ---------- 数据库密码 ----------
  REDIS_PASSWORD: "123456"
  POSTGRES_PASSWORD: "123456"
  MYSQL_ROOT_PASSWORD: "123456"
  RABBITMQ_PASSWORD: "123456"

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: intelligent-cs
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "123456"
  POSTGRES_DB: "fireflymall"

---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: intelligent-cs
  labels:
    app: mysql
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "123456"
  MYSQL_DATABASE: "fireflymall"

---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: intelligent-cs
  labels:
    app: rabbitmq
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: "fufu"
  RABBITMQ_DEFAULT_PASS: "123456"