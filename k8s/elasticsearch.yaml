# ============================================================
# Elasticsearch — 商品检索（RAG）
#
# 注意：这是硬依赖，不是可选项。
# Tools/product_process.py 在模块导入期就会 connect_to_elasticsearch，
# 而它经 agent/front_desk_salesperson.py 被 main.py 导入，
# 所以 ES 不可达时应用会在启动阶段直接失败。
#
# 本清单与 docker-compose.yaml 保持一致：单节点、关闭安全认证。
# 生产环境请改用 xpack.security.enabled=true + TLS，并从 Secret 注入凭据
# （届时 configmap.yaml 里的 es.username / es.password 才真正生效）。
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: intelligent-cs
  labels:
    app: elasticsearch
    component: search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
        component: search
    spec:
      # ES 要求 vm.max_map_count >= 262144，否则启动即报
      # "max virtual memory areas vm.max_map_count [65530] is too low"
      initContainers:
        - name: increase-vm-max-map
          image: busybox:1.36
          command:
            - sysctl
            - -w
            - vm.max_map_count=262144
          securityContext:
            privileged: true
      containers:
        - name: elasticsearch
          image: elasticsearch:8.11.0
          ports:
            - containerPort: 9200
              name: http
          env:
            - name: discovery.type
              value: single-node
            - name: xpack.security.enabled
              value: "false"
            - name: xpack.security.enrollment.enabled
              value: "false"
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
          # ES 冷启动较慢，startupProbe 给足时间，避免被 liveness 误杀
          startupProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: elasticsearch-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-service
  namespace: intelligent-cs
  labels:
    app: elasticsearch
    component: search
spec:
  selector:
    app: elasticsearch
  ports:
    - port: 9200
      targetPort: 9200
      name: http
  type: ClusterIP
