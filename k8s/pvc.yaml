# ============================================================
# PersistentVolumeClaims — 持久化存储
# 生产环境建议使用存储类（StorageClass）动态 provision
# 开发环境可使用 hostPath 或 local 卷
# ============================================================

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: intelligent-cs
  labels:
    app: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: standard  # 取消注释以使用特定存储类

